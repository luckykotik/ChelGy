:host{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1d2233;--mut:#667;--bd:#e3e6f0;--c:#4d2e7b}

:host[data-theme="dark"]{--bg:#12141c;--card:#1b1e2a;--tx:#eef0f8;--mut:#9aa1b8;--bd:#2c3042}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
header{text-align:center;padding:28px 16px 8px}
h1{margin:0;font-size:clamp(26px,5vw,40px)}
header p{margin:6px 0 0;color:var(--mut)}
nav{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;max-width:1000px;margin:auto;scrollbar-width:none}
nav button{flex:0 0 auto;border:2px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;border-radius:999px;font:600 15px inherit;cursor:pointer;transition:.2s}
nav button.on{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.05)}
main{max-width:1000px;margin:auto;padding:0 16px 40px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.panel h2{margin:0 0 4px;font-size:28px;color:var(--c)}
.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
ul.do{padding-left:20px;margin:10px 0}
ul.do li{margin:6px 0}
.jobs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.jobs span{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
.scene{border:1px solid var(--bd);border-radius:16px;padding:14px;background:var(--bg)}
.hint{font-size:13px;color:var(--mut);margin:0 0 10px}
.btn,.chip{border:2px solid var(--c);background:transparent;color:var(--c);padding:8px 12px;border-radius:12px;font:600 14px inherit;cursor:pointer;margin:3px}
.btn{background:var(--c);color:#fff}
.chip.on{background:var(--c);color:#fff}
.btn:active,.chip:active{transform:scale(.95)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:6px 0}
.row b{font-size:13px;color:var(--mut);margin-right:4px}
/* code */
.code{background:#14161f;color:#9ef0b0;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;padding:12px;border-radius:12px;min-height:90px;white-space:pre-wrap}
.stage{height:130px;display:grid;place-items:center;margin-top:8px;background:repeating-conic-gradient(var(--bd) 0 25%,transparent 0 50%) 0 0/24px 24px;border-radius:12px}
#pbox{width:60px;height:60px}
.bounce{animation:bn .7s infinite alternate ease-in}.spin{animation:sp 1.2s infinite linear}.pulse{animation:pl .8s infinite alternate}
@keyframes bn{from{transform:translateY(-40px)}to{transform:translateY(30px)}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes pl{to{transform:scale(1.6)}}
/* police */
.room{position:relative;height:clamp(250px,55vw,360px);min-height:250px;border-radius:12px;overflow:hidden;background:linear-gradient(#8a7a66 0 70%,#5d4d3a 70%);touch-action:pan-y;--x:-300px;--y:-300px;cursor:crosshair}
.room::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle 80px at var(--x) var(--y),transparent 0,transparent 55%,rgba(0,0,0,.94) 100%)}
.room i{position:absolute;font-style:normal;font-size:clamp(25px,5vw,44px);pointer-events:none}
.clue{position:absolute;z-index:1;border:0;background:#ffffff30;border-radius:10px;padding:3px;font-size:clamp(23px,5vw,32px);line-height:1.2;cursor:pointer;transition:transform .2s,filter .2s;transform:translate(-50%,-50%);touch-action:manipulation}
.clue.found{z-index:3;filter:drop-shadow(0 0 8px gold);transform:scale(1.3)}
.file{margin-top:8px;font-size:14px}
/* forest */
.forest{border-radius:12px;overflow:hidden;position:relative;cursor:pointer;transition:background .6s;background:var(--sky)}
.forest.sp{--sky:#bfe6ff;--lf:#58c26b;--gr:#7fd36f}.forest.su{--sky:#8fd3ff;--lf:#2f9e44;--gr:#52b04a}.forest.au{--sky:#ffd9a8;--lf:#e8862f;--gr:#c9a34a}.forest.wi{--sky:#dfe8f2;--lf:#e9f2fa;--gr:#f4f8fb}
.forest svg{display:block;width:100%;height:auto}
.tree{transform-box:fill-box;transform-origin:bottom center;animation:grow 1.2s ease-out}
@keyframes grow{from{transform:scale(.05)}}
.tree .lf{fill:var(--lf);transition:fill .6s}
/* law */
.log{font-size:13px;min-height:54px;margin-top:6px}
.log div{animation:in .3s}
.verdict{font-weight:700;font-size:18px;min-height:28px}
.shake{animation:sh .5s}
@keyframes sh{25%{transform:rotate(-25deg)}50%{transform:rotate(15deg)}75%{transform:rotate(-10deg)}}
/* logistics */
.map{background:color-mix(in srgb,var(--c) 8%,var(--card));border-radius:12px}
svg{max-width:100%}
.pt{cursor:pointer}.pt circle{transition:.2s}.pt:hover circle{r:15}
/* ads */
.banner{border-radius:14px;padding:22px;text-align:center;color:#fff;transition:.4s;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;position:relative}
.banner .em{font-size:60px;animation:bn .9s infinite alternate ease-in-out}
.banner h3{margin:0;font-size:24px}
.banner .cta{background:#fff;color:#111;border-radius:999px;padding:6px 16px;font-weight:700}
.s-a{background:linear-gradient(135deg,#d92520,#ff9710)}.s-b{background:#f4f4f0;color:#222!important}.s-c{background:#0b0b1a;box-shadow:inset 0 0 40px #7b2ff7;text-shadow:0 0 12px #0ff}
.stats{display:flex;gap:16px;margin-top:10px;font-weight:700}
.stats span{font-size:12px;color:var(--mut);display:block;font-weight:400}
.heart{position:absolute;bottom:10px;font-size:22px;animation:fl 2s forwards}
@keyframes fl{to{transform:translateY(-170px);opacity:0}}
input[type=text]{width:100%;padding:8px 10px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:15px inherit}
.card{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:14px;min-height:64px}
/* стиль ЧелГУ: яркие цветные блоки, контраст, гротеск */
:host{--bg:#f2efe8;--brand:#4d2e7b;--accent:#ff9710;--hot:#d92520;--tx:#14142b;--bd:#dcd8cc;--mut:#5d5d73}
body{font-family:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:17px}
button,input{font-family:inherit}
nav{display:none}
header{display:flex;align-items:center;gap:16px;text-align:left;padding:18px 20px;background:var(--brand);color:#fff}
header h1{font-size:clamp(20px,4vw,32px);font-weight:800;line-height:1.1}
header p{color:#eadcff;margin:4px 0 0;font-size:14px}
.lg{background:var(--hot);color:#fff;font-weight:800;font-size:clamp(20px,4vw,28px);padding:10px 14px;border-radius:12px;transform:rotate(-5deg);flex:0 0 auto}
main{padding-top:22px}
.panel{border:0;border-top:10px solid var(--c);border-radius:24px}
.panel h2{font-weight:800}
.scene{background:color-mix(in srgb,var(--c) 10%,#fff);border:0;border-radius:18px}
.jobs span{background:var(--c);color:#fff}
.btn,.chip{border-radius:999px;font-weight:700}
.back{border:0;background:var(--brand);color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer;margin-bottom:10px}
.back:hover{background:#3a2260}
.lg{background:#fff;padding:6px 10px;transform:rotate(-3deg);box-shadow:0 4px 0 rgba(0,0,0,.15)}.lg img{display:block;height:46px;width:auto}
#fs{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.55);border-radius:10px;font-size:20px;padding:4px 10px;cursor:pointer}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.top h2{margin:0;font-size:28px;color:var(--c);font-weight:800}
.top .back{margin:0}
.grid{align-items:start}
.bt{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
main.full{max-width:none;padding:0;background:radial-gradient(circle at 50% 50%,#fff 0,var(--bg) 75%)}
main.full+footer{display:none}
footer{text-align:center;color:var(--mut);font-size:13px;padding:0 16px 30px}
.ico{height:1.5em;width:auto;max-width:2.4em;object-fit:contain;vertical-align:middle;background:#fff;border-radius:12px;padding:3px 5px;border:3px solid var(--c);margin-right:6px}

/* ===== дизайн 2.0: анимации ===== */
main.full{background:transparent}
header{position:relative;overflow:hidden}
header>*{position:relative;z-index:1}
header::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:#ff9710;opacity:.28;right:7%;top:-70px;animation:xdr 7s ease-in-out infinite alternate}
header::after{content:"";position:absolute;width:74px;height:74px;border-radius:20px;background:#d92520;opacity:.4;right:24%;bottom:-34px;transform:rotate(20deg);animation:xdr2 9s ease-in-out infinite alternate}
@keyframes xdr{to{transform:translate(-40px,30px) scale(1.25)}}
@keyframes xdr2{to{transform:translate(50px,-18px) rotate(80deg)}}
header h1{animation:xin .7s .1s both}header p{animation:xin .7s .3s both}
@keyframes xin{from{opacity:0;transform:translateX(-24px)}}
.lg{animation:xsw 5s ease-in-out infinite;transition:transform .2s}
.lg:hover{animation-play-state:paused;transform:rotate(4deg) scale(1.1)}
@keyframes xsw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(2deg) translateY(-2px)}}
.xfl{animation:xflt 3.8s ease-in-out infinite}
@keyframes xflt{50%{transform:translateY(-7px)}}
.hn:hover{transform:scale(1.14) rotate(-3deg)}
.hn rect{filter:drop-shadow(0 5px 0 rgba(20,20,43,.2))}
.pc{filter:drop-shadow(0 8px 0 rgba(77,46,123,.25))}
.grid>.panel{border:3px solid var(--tx);border-radius:24px;box-shadow:8px 8px 0 var(--c);animation:none}
.grid>.panel:nth-child(1){animation:xl .6s cubic-bezier(.2,.9,.3,1.15) both}
.grid>.panel:nth-child(2){animation:xr .6s .12s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes xl{from{opacity:0;transform:translateX(-50px) rotate(-1.5deg)}}
@keyframes xr{from{opacity:0;transform:translateX(50px) rotate(1.5deg)}}
.top h2{animation:xin .5s both}
.ico{animation:xbn .7s .15s both;transition:transform .25s}
.ico:hover{transform:rotate(-8deg) scale(1.12)}
@keyframes xbn{0%{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}
.do li{animation:xli .5s both}
.do li:nth-child(1){animation-delay:.3s}.do li:nth-child(2){animation-delay:.45s}.do li:nth-child(3){animation-delay:.6s}
@keyframes xli{from{opacity:0;transform:translateX(-16px)}}
.jobs span{animation:xpop .45s both;transition:transform .2s}
.jobs span:hover{transform:translateY(-3px) rotate(-2deg)}
.jobs span:nth-child(1){animation-delay:.7s}.jobs span:nth-child(2){animation-delay:.8s}.jobs span:nth-child(3){animation-delay:.9s}.jobs span:nth-child(4){animation-delay:1s}.jobs span:nth-child(n+5){animation-delay:1.1s}
@keyframes xpop{from{opacity:0;transform:scale(.3)}}
.btn,.chip{box-shadow:0 3px 0 rgba(20,20,43,.2);transition:transform .15s,box-shadow .15s,background .2s}
.btn:hover,.chip:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(20,20,43,.22)}
.btn:active,.chip:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(20,20,43,.2)}
.back{transition:transform .2s}.back:hover{transform:translateX(-4px)}
.scene{animation:xin .6s .35s both}
.wipe{position:fixed;inset:0;z-index:99;pointer-events:none;animation:xwipe .7s cubic-bezier(.7,0,.2,1) forwards}
@keyframes xwipe{from{clip-path:circle(150% at var(--x) var(--y))}to{clip-path:circle(0% at var(--x) var(--y))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

body{overflow-x:hidden}
main.xf>:not(style){animation:xslf .5s cubic-bezier(.2,.8,.2,1) both}
main.xb>:not(style){animation:xslb .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes xslf{from{opacity:0;transform:translateX(80px)}}
@keyframes xslb{from{opacity:0;transform:translateX(-80px)}}
.wipe{display:none}

/* ===== анимации 3.0: эффекты (палитра не меняется) ===== */
@keyframes xrpl{to{transform:scale(4);opacity:0}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:xrpl .55s ease-out forwards;pointer-events:none}
.btn,.chip{position:relative;overflow:hidden}
@keyframes xwig{25%{transform:rotate(-4deg) scale(1.1)}75%{transform:rotate(4deg) scale(1.1)}}
nav button:hover{animation:xwig .35s ease}
@keyframes xpop2{0%{transform:scale(.88)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.pop{animation:xpop2 .35s ease}
@keyframes xcatch{0%{transform:scale(.3) rotate(-20deg)}60%{transform:scale(1.6) rotate(8deg)}100%{transform:scale(1.3)}}
.clue.found{animation:xcatch .5s cubic-bezier(.2,.9,.3,1.3)}
.xpt{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:98}
@keyframes xsheen{to{background-position:-220% 0}}
header h1{background:linear-gradient(100deg,#fff 42%,#ffffff70 50%,#fff 58%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:xsheen 6s linear infinite}
.scene{position:relative;overflow:hidden}
@keyframes xsweep{0%,55%{left:-75%}100%{left:145%}}
.scene::after{content:"";position:absolute;top:-20%;left:-75%;width:45%;height:140%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-18deg);animation:xsweep 5.5s ease-in-out infinite;pointer-events:none}
.panel{transition:box-shadow .3s}
.panel:hover{box-shadow:10px 10px 0 var(--c),0 22px 34px -14px rgba(20,20,43,.4)}
.card{animation:xin .5s both}
@keyframes xwin{0%{transform:scale(.5) rotate(-4deg);opacity:0}55%{transform:scale(1.2) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
.verdict.win{animation:xwin .6s cubic-bezier(.2,.9,.3,1.25)}
.jobs span:active{transform:scale(.9)}



/* Мягкие переходы между направлениями и карточками */
nav button{transition:background-color .38s cubic-bezier(.22,.8,.25,1),color .32s ease,border-color .32s ease,transform .38s cubic-bezier(.22,.8,.25,1),box-shadow .38s ease!important;animation:none!important;will-change:transform}
nav button:hover{transform:translateY(-3px) scale(1.025);box-shadow:0 7px 16px rgba(77,46,123,.13);animation:none!important}
nav button.on{transform:translateY(-1px) scale(1.025);box-shadow:0 5px 14px color-mix(in srgb,var(--c) 24%,transparent)}
.jobs span{display:inline-block;transition:transform .42s cubic-bezier(.2,.8,.2,1),background-color .35s ease,color .35s ease,box-shadow .4s ease!important;will-change:transform}
.jobs span:hover{transform:translateY(-5px) scale(1.035)!important;box-shadow:0 8px 18px rgba(20,20,43,.14);}
.panel{transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s cubic-bezier(.2,.8,.2,1),border-color .35s ease!important}
.panel:hover{transform:translateY(-3px)}
main.xf>:not(style),main.xb>:not(style){animation-duration:.72s!important;animation-timing-function:cubic-bezier(.18,.75,.25,1)!important}
/* Соединения без точек и пунктирной анимации */
.route-line{stroke-dasharray:none!important;animation:none!important;stroke-width:2!important;opacity:.28!important}
.route-glow{stroke-width:5!important;opacity:.055!important;filter:none!important}
.route-dot{display:none!important;opacity:0!important}
@media(prefers-reduced-motion:reduce){nav button,.jobs span,.panel{transition:none!important}}


/* DESIGN UPGRADE — clean editorial, calmer motion, stronger hierarchy */
:host{--bg:#f7f5f1;--card:#fffefa;--tx:#201b2b;--mut:#716b7c;--bd:#e8e2ec;--brand:#39205f;--accent:#ff9b36;--hot:#e34b45}
body{background:linear-gradient(145deg,#faf7f0 0%,#f5f0fb 55%,#fff4ed 100%) fixed;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em}
#bgfx::before{opacity:.34;background-size:38px 38px}
#bgfx::after{opacity:.48;filter:blur(70px);animation-duration:70s}
.pw{opacity:.38!important}
header{min-height:104px;padding:22px clamp(18px,4vw,42px);gap:18px;background:linear-gradient(115deg,#2e194e 0%,#4d2e7b 62%,#5e367e 100%);box-shadow:0 8px 28px #2e194e1a}
header::before{width:230px;height:230px;right:12%;top:-140px;opacity:.18}
header::after{width:96px;height:96px;right:31%;bottom:-58px;opacity:.22}
header h1{font-size:clamp(25px,4vw,36px);letter-spacing:-.045em;line-height:1.04}
header p{font-size:14px;letter-spacing:.01em;opacity:.88}
.lg{border-radius:15px;box-shadow:0 5px 0 #170b2b55,0 12px 28px #13092026;animation:none;transform:none}
.lg img{height:44px;width:auto}
#fs{margin-left:auto;min-width:44px;min-height:44px;border-radius:13px;transition:background .25s,transform .25s,border-color .25s}
#fs:hover{background:#ffffff2b;transform:translateY(-2px);border-color:#fff}
main{max-width:1120px;padding:28px clamp(16px,3vw,28px) 48px}
main.full{padding:12px clamp(8px,2vw,22px) 32px;background:radial-gradient(ellipse at 50% 45%,#ffffffd9 0%,#ffffff50 42%,transparent 72%)}
.top{gap:16px;margin:0 0 22px;padding:0 0 16px;border-bottom:1px solid #d9d0e2}
.top h2{font-size:clamp(23px,3vw,32px);letter-spacing:-.035em;display:flex;align-items:center;gap:10px}
.back{padding:10px 16px;background:#39205f;border:1px solid #39205f;box-shadow:0 3px 0 #21113722;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,background .28s}
.back:hover{background:#4d2e7b;transform:translateX(-3px);box-shadow:0 6px 14px #39205f20}
.grid{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:24px;align-items:stretch}
.grid>.panel{border:1px solid #e5deeb;border-top:5px solid var(--c);border-radius:22px;background:rgba(255,254,250,.94);box-shadow:0 8px 26px #3020440b,0 2px 5px #30204408;padding:clamp(18px,2.3vw,26px);animation:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,border-color .35s}
.grid>.panel:hover{transform:translateY(-3px);box-shadow:0 16px 38px #30204412,0 4px 10px #30204408}
.grid>.panel:nth-child(1){animation:panel-enter .55s cubic-bezier(.2,.8,.2,1) both}
.grid>.panel:nth-child(2){animation:panel-enter .55s .08s cubic-bezier(.2,.8,.2,1) both}
@keyframes panel-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.bt{font-size:12px;letter-spacing:.11em;font-weight:800;color:#766783;margin-bottom:14px}
.grid>.panel h3.bt{display:flex;align-items:center;gap:8px}
.do{padding-left:0!important;list-style:none!important;margin:12px 0 22px!important}
.do li{position:relative;padding:11px 12px 11px 37px;margin:8px 0!important;border-radius:12px;background:#f7f3fa;border:1px solid #eee7f4;color:#342b40;animation:none!important;transition:background .3s,border-color .3s,transform .3s}
.do li::before{content:'✓';position:absolute;left:12px;top:10px;display:grid;place-items:center;width:18px;height:18px;border-radius:6px;background:color-mix(in srgb,var(--c) 13%,white);color:var(--c);font-size:12px;font-weight:900}
.do li:hover{transform:translateX(3px);background:#fff;border-color:color-mix(in srgb,var(--c) 25%,#eee7f4)}
.grid>.panel>b{font-size:14px;letter-spacing:-.01em}
.jobs{gap:8px;margin-top:12px}
.jobs span{margin:0;padding:7px 11px;border-radius:9px;background:color-mix(in srgb,var(--c) 9%,white);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 16%,white);font-size:13px;animation:none!important;transition:transform .28s cubic-bezier(.2,.8,.2,1),background .28s,color .28s,box-shadow .28s!important}
.jobs span:hover{transform:translateY(-2px)!important;background:var(--c);color:#fff;box-shadow:0 5px 12px color-mix(in srgb,var(--c) 18%,transparent)}
.bridge-note{padding:13px 15px;border:1px solid color-mix(in srgb,var(--c) 14%,#fff);border-left:4px solid var(--c);border-radius:12px;background:color-mix(in srgb,var(--c) 5%,white);font-size:14px;line-height:1.6;color:#51475d}
.scene{background:linear-gradient(145deg,#faf7fd,#f4eff9);border:1px solid #e8dff0;border-radius:16px;padding:16px;animation:none!important}
.scene::after{display:none}
.btn,.chip{box-shadow:0 2px 0 #24163b18;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,background-color .3s,color .3s,border-color .3s!important}
.btn{background:var(--c);border-color:var(--c)}
.btn:hover,.chip:hover{transform:translateY(-2px);box-shadow:0 7px 15px #30204416}
.chip{background:#fffefa;border-color:#ddd3e8}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.btn:active,.chip:active{transform:scale(.98)}
.card{border:1px solid #e9e2ee;background:#fffefa;box-shadow:0 3px 12px #30204408;animation:none}
input[type=text]{border:1px solid #ddd3e8;box-shadow:inset 0 1px 2px #30204408;transition:border-color .25s,box-shadow .25s}
input[type=text]:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 13%,transparent)}
.code{border:1px solid #332940;background:#211b2c;border-radius:14px}
.stage{border:1px solid #e5dceb;background-color:#f7f2fa}
.banner{border-radius:18px;box-shadow:0 12px 26px #21113718}
.stats{gap:10px;flex-wrap:wrap}
.stats>div{padding:10px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.ico{height:42px;max-width:2.6em;border:2px solid color-mix(in srgb,var(--c) 25%,white);border-radius:12px;box-shadow:0 4px 10px #30204412;animation:none!important}
/* The home screen connection map: clear, quiet lines with a soft color anchor */
.route-line{stroke-width:1.5!important;opacity:.22!important;stroke-linecap:round}
.route-glow{stroke-width:7!important;opacity:.035!important}
.hn{filter:drop-shadow(0 4px 7px #30204410);transition:transform .42s cubic-bezier(.2,.8,.2,1),filter .42s!important}
.hn:hover{filter:drop-shadow(0 12px 12px #30204422)!important}
.hn .xfl rect{stroke-width:3!important;filter:none!important;transition:stroke-width .35s,fill .35s,filter .35s}
.hn:hover .xfl rect{stroke-width:4.5!important;filter:drop-shadow(0 4px 8px #30204418)!important}
.pc{filter:drop-shadow(0 10px 16px #30204416)!important;animation:pcs 5s ease-in-out infinite!important}
@keyframes pcs{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
footer{padding:12px 16px 28px;color:#82798d}
@media(max-width:760px){
 header{padding:17px 15px;gap:12px;min-height:88px}header h1{font-size:24px}header p{font-size:12px}.lg img{height:36px}#fs{min-width:38px;min-height:38px;padding:3px 8px}
 main{padding:18px 13px 34px}.grid{grid-template-columns:1fr;gap:16px}.grid>.panel{padding:18px;border-radius:18px}.top{align-items:flex-start;gap:12px;flex-direction:column}.top h2{font-size:25px}.ico{height:36px}.bridge-note{font-size:13px}
}
@media(prefers-reduced-motion:reduce){.grid>.panel,.do li,.jobs span,.hn,.pc{animation:none!important;transition:none!important}}


:host{--bg:#f5f0e7;--card:#fffaf2;--tx:#21192d;--mut:#726a79;--bd:#ded4c8;--brand:#29133f;--brand2:#4d2e7b;--accent:#ff9710;--hot:#d92520}
body{background:#f5f0e7;color:var(--tx);font-family:Arial,"Segoe UI",sans-serif}
header{min-height:82px;padding:16px clamp(18px,4vw,54px);background:#29133f;color:#fff;gap:18px;border-bottom:1px solid #ffffff1a}
header::before{width:260px;height:260px;right:16%;top:-175px;background:#ff9710;opacity:.18}
header::after{background:#d92520;opacity:.2}
header h1{font-size:clamp(20px,2.7vw,31px);letter-spacing:-.04em}
header p{font-size:13px;color:#d6c8e3}
.lg{animation:none;background:transparent;box-shadow:none;transform:none;padding:0 12px 0 0;border-right:1px solid #ffffff50;border-radius:0}
.lg:hover{animation:none;transform:scale(1.04)}
#fs{background:transparent;border-color:#ffffff50;border-radius:999px;transition:background .25s,transform .25s}
#fs:hover{background:#ffffff20;transform:rotate(8deg)}
main.full{max-width:none;padding:0;background:#f5f0e7}
main.full+footer{display:block;background:#29133f;color:#cbbdd7;padding:20px}
.landing{max-width:1440px;margin:0 auto;overflow:hidden}
.hero{min-height:490px;background:#29133f;color:#fff;display:grid;grid-template-columns:1.04fr .96fr;position:relative;isolation:isolate;overflow:hidden}
.hero-copy{padding:clamp(32px,6vw,82px) clamp(22px,5.4vw,78px);position:relative;z-index:2}
.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--accent);display:inline-flex;align-items:center;gap:9px}
.eyebrow span{width:22px;height:3px;background:var(--accent);display:inline-block}
.hero h2,.section-heading h2,.steps-intro h2,.closing-band h2{font-size:clamp(38px,6vw,78px);line-height:.94;letter-spacing:-.065em;font-weight:950;margin:22px 0}
.hero h2 em,.section-heading h2 em,.steps-intro h2 em,.closing-band h2 em{font-style:normal;color:var(--accent)}
.hero-copy>p{max-width:430px;color:#ded5e5;font-size:clamp(15px,1.4vw,18px);line-height:1.6;margin:24px 0}
.hero-cta{border:0;background:var(--accent);color:#251436;border-radius:5px;padding:13px 16px 13px 19px;display:inline-flex;align-items:center;gap:25px;font-size:12px;letter-spacing:.04em;font-weight:900;cursor:pointer;transition:transform .3s,background .3s,box-shadow .3s;box-shadow:0 4px 0 #b76700}
.hero-cta span{display:grid;place-items:center;border-radius:50%;width:27px;height:27px;background:#29133f;color:white;font-size:20px;transition:transform .3s}
.hero-cta:hover{transform:translateY(-3px);background:#ffc04a;box-shadow:0 7px 0 #b76700}
.hero-cta:hover span{transform:rotate(-35deg)}
.hero-note{display:flex;gap:12px;align-items:center;margin-top:36px;color:#fff}
.hero-note-mark{font-size:28px;color:var(--accent)}
.hero-note b,.hero-note small{display:block}.hero-note b{font-size:13px}.hero-note small{color:#bfb0cc;font-size:12px;margin-top:3px}
.hero-visual{position:relative;min-height:390px;overflow:hidden;background:linear-gradient(145deg,#4d2e7b,#37184e 58%,#21102f)}
.hero-visual:before{content:"";position:absolute;width:60%;height:110%;right:4%;top:-8%;background:var(--accent);clip-path:polygon(18% 0,100% 0,80% 100%,0 100%);opacity:.98}
.hero-visual:after{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff8 1px,transparent 1.5px);background-size:15px 15px;mask-image:linear-gradient(90deg,transparent,#000 70%);opacity:.4}
.hero-orbit{position:absolute;z-index:1;border:1px solid #ffffff50;border-radius:50%;width:72%;aspect-ratio:1;left:7%;top:8%;transform:rotate(-22deg)}
.orbit-two{width:52%;left:19%;top:20%;border-color:#29133f90;transform:rotate(38deg)}
.hero-bigmark{position:absolute;z-index:1;font-weight:1000;font-size:clamp(180px,30vw,370px);line-height:1;color:#29133f;opacity:.24;right:8%;top:10%;letter-spacing:-.1em}
.hero-logo{position:absolute;z-index:2;top:10%;left:9%;display:flex;align-items:center;gap:10px;color:#29133f;font-size:11px;font-weight:800;line-height:1.1}
.hero-logo img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:50%;padding:7px}
.hero-logo b{font-size:23px}
.hero-sticker{position:absolute;z-index:3;background:#f5f0e7;color:#29133f;font-size:11px;font-weight:900;line-height:1.1;padding:13px 16px;box-shadow:5px 5px 0 #29133f40;transform:rotate(-7deg)}
.sticker-a{left:12%;bottom:22%}.sticker-b{right:11%;top:28%;background:#d92520;color:white;transform:rotate(8deg);font-size:14px}.sticker-b b{font-size:25px}
.hero-caption{position:absolute;z-index:3;bottom:0;left:0;right:0;padding:18px 8%;display:flex;justify-content:space-between;gap:12px;background:#29133fdd;color:#fff;font-size:10px;letter-spacing:.1em}
.hero-caption span{color:var(--accent)}
.program-section{padding:clamp(38px,6vw,78px) clamp(18px,4vw,56px) clamp(44px,6vw,80px)}
.section-heading{display:grid;grid-template-columns:1.1fr .7fr;gap:35px;align-items:end;margin-bottom:28px}
.section-heading .eyebrow,.steps-intro .eyebrow{color:#4d2e7b}
.section-heading h2,.steps-intro h2{font-size:clamp(34px,4.5vw,57px);margin:14px 0 0;color:#29133f}
.section-heading h2 em,.steps-intro h2 em{color:#4d2e7b}
.section-heading>p{font-size:14px;line-height:1.7;color:#625968;max-width:420px;margin:0 0 5px}
.program-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.program-card{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:245px;padding:17px;border:0;border-radius:7px;overflow:hidden;background:var(--brand);color:#fff;cursor:pointer;box-shadow:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,background .35s}
.program-card:before{content:"";position:absolute;z-index:-2;inset:0;background:var(--card-accent);clip-path:polygon(0 0,100% 0,100% 38%,0 74%);opacity:.96;transition:clip-path .55s cubic-bezier(.2,.8,.2,1)}
.program-card:after{content:"";position:absolute;z-index:-1;width:170px;height:170px;border:1px solid #ffffff4a;border-radius:50%;right:-60px;top:70px;transition:transform .55s}
.program-card:nth-child(4n+2):before{clip-path:polygon(0 0,70% 0,100% 100%,0 100%);background:#4d2e7b}
.program-card:nth-child(4n+3):before{clip-path:polygon(0 0,100% 0,100% 100%,35% 100%);background:#d92520}
.program-card:nth-child(4n+4):before{clip-path:polygon(0 0,100% 0,100% 65%,0 100%);background:#ff9710}
.program-num{font-size:42px;line-height:1;font-weight:950;letter-spacing:-.08em;color:var(--accent);position:relative;z-index:2}
.program-art{position:absolute;right:5px;top:36px;width:54%;height:53%;display:grid;place-items:center;transition:transform .45s}
.program-art img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 8px #170c2440);background:transparent;border:0;padding:3px}
.program-copy{margin-top:auto;max-width:85%;padding:12px 0 8px;position:relative;z-index:2}
.program-copy b{display:block;font-size:clamp(14px,1.2vw,17px);line-height:1.15;text-transform:uppercase;font-weight:900}
.program-copy small{display:block;font-size:11px;line-height:1.4;color:#e8dfed;margin-top:8px;max-width:240px}
.program-arrow{position:absolute;right:14px;bottom:14px;width:33px;height:33px;display:grid;place-items:center;background:var(--accent);color:#29133f;border-radius:50%;font-size:21px;font-weight:900;transition:transform .35s,background .35s}
.program-card:hover{transform:translateY(-6px);box-shadow:0 14px 28px #29133f20}
.program-card:hover:before{clip-path:polygon(0 0,100% 0,100% 100%,0 83%)}
.program-card:hover:after{transform:scale(1.5) translate(-12px,-10px)}
.program-card:hover .program-art{transform:translate(-6px,-5px) rotate(-3deg) scale(1.06)}
.program-card:hover .program-arrow{transform:rotate(45deg);background:#fff}
.program-card:focus-visible,.hero-cta:focus-visible{outline:3px solid #d92520;outline-offset:4px}
.steps-section{background:#29133f;color:#fff;padding:clamp(38px,5vw,68px) clamp(18px,4vw,56px);display:grid;grid-template-columns:.8fr 1.2fr;gap:42px;align-items:center}
.steps-intro h2{color:#fff}
.steps-intro h2 em{color:var(--accent)}
.steps-intro p{max-width:360px;color:#d2c5dd;line-height:1.6;font-size:14px}
.steps-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.step{border-top:1px solid #ffffff50;padding-top:17px}
.step>span{display:grid;place-items:center;width:43px;height:43px;background:#4d2e7b;border:1px solid #a994c1;border-radius:50%;color:#fff;font-weight:900;margin-bottom:24px}
.step b{font-size:13px;letter-spacing:.06em;color:var(--accent)}
.step p{font-size:12px;line-height:1.6;color:#d2c5dd}
.closing-band{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:28px clamp(18px,4vw,56px);background:var(--accent);color:#29133f}
.closing-band .eyebrow{color:#29133f}
.closing-band h2{font-size:clamp(28px,4vw,44px);margin:12px 0}
.closing-band h2 em{color:#d92520}
.closing-band .hero-cta{background:#29133f;color:#fff;box-shadow:0 4px 0 #5e3100}
.closing-band .hero-cta span{background:var(--accent);color:#29133f}

.forest .tree .lf{transition:fill .8s}
.forest .tree .lf.c{fill:#2f7d4a}
.forest.sp .tree .lf.c{fill:#3f9d5c}.forest.su .tree .lf.c{fill:#25703d}.forest.au .tree .lf.c{fill:#2f6b3a}.forest.wi .tree .lf.c{fill:#2c5f48}
.forest.sp .tree .lf.d{fill:var(--sp)}.forest.su .tree .lf.d{fill:var(--su)}.forest.au .tree .lf.d{fill:var(--au)}.forest.wi .tree .lf.d{fill:var(--au)}
.tree .crown{transition:opacity 1.8s ease .3s}
.forest.wi .tree .crown{opacity:0}
.tree .snow{fill:#fff;opacity:0;transition:opacity 1.2s}
.forest.wi .tree .snow{opacity:.95}
.forest[data-full]{cursor:not-allowed}
